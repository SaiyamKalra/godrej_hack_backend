services:
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      inference:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://app:password@postgres:5432/myapp
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      INFERENCE_SERVICE_URL: http://inference:8000
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      CLIP_OUTPUT_DIR: /app/clips
    volumes:
      - clips_data:/app/clips

  inference:
    build: ../inference_service
    ports:
      - "8000:8000"
    volumes:
      - ../best.pt:/app/model/best.pt:ro
      - clips_data:/app/clips
    environment:
      - MODEL_PATH=model/best.pt
      - YOLO_CONF_THRESHOLD=0.5
      - YOLO_IOU_THRESHOLD=0.45
      - CLIP_OUTPUT_DIR=/app/clips
      - BACKEND_WEBHOOK_URL=http://backend:8080/api/alerts/webhook
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    volumes:
      - es_data:/usr/share/elasticsearch/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ${OLLAMA_VOLUME_PATH}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_started
    command: >
      sh -c "
        while ! curl -s --max-time 2 http://ollama:11434/api/tags > /dev/null; do
          echo 'Waiting for Ollama to be ready...';
          sleep 1;
        done;
        echo 'Ollama is ready. Pulling model ${OLLAMA_MODEL}...';
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL}\"}';
        echo 'Model pulled successfully.';
      "

volumes:
  postgres_data:
  clips_data:
  es_data:
  ollama_models:
